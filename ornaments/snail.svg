  <path d="M100 70m-6 0a6 6 0 1 1 12 0a12 12 0 1 1-24 0a18 18 0 1 1 36 0a24 24 0 1 1-48 0a30 30 0 1 1 60 0" fill="none" stroke="#a8251b" stroke-width="3"/>
