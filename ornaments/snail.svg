  <path d="M36 116c10-14 40-16 70-14 26 2 52 0 66-10 8-6 12-18 10-28l6-22" fill="none" stroke="#2a1a0e" stroke-width="2"/>
  <path d="M36 116c30 2 100 2 140-6 10-2 16-14 14-26-2-6-4-14-2-26" fill="#c9b48a" stroke="#2a1a0e" stroke-width="2"/>
